<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOÜ Mevzuat Asistanı – Giriş</title>
<style>
  :root {
    --brand: #0f8a63; --brand-2: #15b39a; --brand-soft: #e3f4ee;
    --bg: #f3f6f5; --surface: #ffffff; --text: #14201b; --muted: #5f6f68; --border: #e1e8e5; --danger: #d9534f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand: #34c796; --brand-2: #4fd8c4; --brand-soft: #15302a;
      --bg: #0b100e; --surface: #141b18; --text: #e7eeea; --muted: #93a39b; --border: #25302b; --danger: #ef7d76;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 16px; color: var(--text);
    background: radial-gradient(800px 500px at 10% -10%, rgba(21,179,154,.16), transparent 60%), var(--bg);
    font: 15px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  .card {
    width: min(380px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 28px 24px; box-shadow: 0 12px 40px rgba(16,40,30,.12); text-align: center;
  }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 16px; color: #fff; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 10px 24px rgba(15,138,99,.35);
  }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font: inherit; text-align: center; letter-spacing: .08em;
  }
  input:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
  button {
    width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 12px; cursor: pointer; color: #fff;
    font: inherit; font-weight: 650; background: linear-gradient(135deg, var(--brand), var(--brand-2));
  }
  .error { display: none; margin-top: 12px; color: var(--danger); font-size: 13px; }
</style>
</head>
<body>
<form class="card" method="post" action="/giris">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v15H6a2 2 0 0 0-2 2z"/><path d="M8 7h6M8 11h6"/></svg>
  </div>
  <h1>KOÜ Mevzuat Asistanı</h1>
  <p>Devam etmek için erişim kodunu girin.</p>
  <input type="password" name="kod" autocomplete="current-password" placeholder="Erişim kodu" aria-label="Erişim kodu" required autofocus>
  <button type="submit">Giriş</button>
  <div class="error" id="error">Kod hatalı, tekrar deneyin.</div>
</form>
<script>
  if (new URLSearchParams(location.search).has("hata")) document.getElementById("error").style.display = "block";
</script>
</body>
</html>
